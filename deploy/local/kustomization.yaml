apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../foundation.yaml
patches:
  - target:
      kind: ResourceQuota
      name: workspace-budget
      namespace: sandbox-workspaces
    patch: |-
      - op: replace
        path: /spec/hard
        value:
          count/pods: '1'
          count/configmaps: '4'
          requests.cpu: '1'
          limits.cpu: '1'
          requests.memory: 512Mi
          limits.memory: 512Mi
          requests.ephemeral-storage: 1Gi
          limits.ephemeral-storage: 1Gi
